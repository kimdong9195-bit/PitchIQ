<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>비밀번호 찾기 - PitchIQ</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 420px; margin: 80px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 22px; }
  form { background: #f5f5f7; padding: 20px; border-radius: 12px; }
  label { display: block; font-size: 13px; color: #555; margin-top: 12px; }
  input { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
  button { margin-top: 16px; padding: 10px 20px; background: #0070f3; color: white; border: none; border-radius: 6px; cursor: pointer; width: 100%; }
  .message { color: #1a7f37; background: #e6f4ea; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
  .link { text-align: center; margin-top: 16px; font-size: 13px; }
</style>
</head>
<body>
  <h1>⚽ 비밀번호 찾기</h1>
  <p style="font-size:13px; color:#666;">가입하신 이메일을 입력하시면, 비밀번호 재설정 링크를 보내드립니다.</p>

  {% if message %}
  <div class="message">{{ message }}</div>
  {% endif %}

  <form method="POST" action="/forgot-password">
    <label>이메일</label>
    <input type="email" name="email" required>

    <button type="submit">재설정 링크 받기</button>
  </form>

  <p class="link"><a href="/login">로그인으로 돌아가기</a></p>
</body>
</html>
