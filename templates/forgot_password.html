<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>비밀번호 찾기 - PitchIQ</title>
<style>
  html {
    background-color: #f4f6fa;
    background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%201000%20600%22%3E%0A%3Crect%20x%3D%2220%22%20y%3D%2220%22%20width%3D%22960%22%20height%3D%22560%22%20fill%3D%22none%22%20stroke%3D%22rgba%28128%2C128%2C128%2C0.09%29%22%20stroke-width%3D%223%22/%3E%0A%3Cline%20x1%3D%22500%22%20y1%3D%2220%22%20x2%3D%22500%22%20y2%3D%22580%22%20stroke%3D%22rgba%28128%2C128%2C128%2C0.09%29%22%20stroke-width%3D%223%22/%3E%0A%3Ccircle%20cx%3D%22500%22%20cy%3D%22300%22%20r%3D%2290%22%20fill%3D%22none%22%20stroke%3D%22rgba%28128%2C128%2C128%2C0.09%29%22%20stroke-width%3D%223%22/%3E%0A%3Ccircle%20cx%3D%22500%22%20cy%3D%22300%22%20r%3D%224%22%20fill%3D%22rgba%28128%2C128%2C128%2C0.09%29%22/%3E%0A%3Cpath%20d%3D%22M%2020%20180%20Q%20100%20300%2020%20420%22%20fill%3D%22none%22%20stroke%3D%22rgba%28128%2C128%2C128%2C0.09%29%22%20stroke-width%3D%223%22/%3E%0A%3Cpath%20d%3D%22M%20980%20180%20Q%20900%20300%20980%20420%22%20fill%3D%22none%22%20stroke%3D%22rgba%28128%2C128%2C128%2C0.09%29%22%20stroke-width%3D%223%22/%3E%0A%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: center center;
    background-size: cover;
    background-attachment: fixed;
    min-height: 100%;
  }
  body { font-family: -apple-system, sans-serif; max-width: 420px; margin: 80px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 22px; }
  form { background: #f5f5f7; padding: 20px; border-radius: 12px; }
  label { display: block; font-size: 13px; color: #555; margin-top: 12px; }
  input { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
  button { margin-top: 16px; padding: 10px 20px; background: #0070f3; color: white; border: none; border-radius: 6px; cursor: pointer; width: 100%; }
  .message { color: #1a7f37; background: #e6f4ea; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
  .link { text-align: center; margin-top: 16px; font-size: 13px; }
</style>
</head>
<body>
  <h1>⚽ 비밀번호 찾기</h1>
  <p style="font-size:13px; color:#666;">가입하신 이메일을 입력하시면, 비밀번호 재설정 링크를 보내드립니다.</p>

  {% if message %}
  <div class="message">{{ message }}</div>
  {% endif %}

  <form method="POST" action="/forgot-password">
    <label>이메일</label>
    <input type="email" name="email" required>

    <button type="submit">재설정 링크 받기</button>
  </form>

  <p class="link"><a href="/login">로그인으로 돌아가기</a></p>
</body>
</html>
